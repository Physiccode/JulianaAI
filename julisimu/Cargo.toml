[package]
name = "julisimu"
version = "0.1.0"
edition = "2024"

[dependencies]

#TODO:REMOVE THE DYANMIC LINKING BEFORE PROD RELEASE
bevy = { version="0.19.1" , features=["dynamic_linking","default","jpeg"] }
rand = "0.10.3"
[profile.release]
opt-level = 'z'  
lto = true        
codegen-units = 1  
panic = 'abort'     
strip = true      

[profile.dev.package."*"]
debug=false
